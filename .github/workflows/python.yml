name: python

on:
  workflow_call:
  workflow_dispatch:

jobs:
  ruff-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Pytest
        run: python -m pytest
      - name: Deterministic flood sim
        run: python -m simulation.python.run --scenario simulation/scenarios/flood-bogota-demo.yaml --seed 42
      - name: Health harness
        run: python harness/dev/healthcheck.py
