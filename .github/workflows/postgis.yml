name: postgis

on:
  workflow_call:
  workflow_dispatch:

jobs:
  postgis-pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: polaris
          POSTGRES_PASSWORD: polaris
          POSTGRES_DB: polaris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polaris -d polaris"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POLARIS_DATABASE_URL: postgresql+psycopg://polaris:polaris@localhost:5432/polaris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest PostGIS marker
        run: python -m pytest -m postgis
