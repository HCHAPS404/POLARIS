name: cpp

on:
  workflow_call:
  workflow_dispatch:

jobs:
  placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: Configure and test C++20 kernel
        run: |
          cmake -S . -B build/cpp
          cmake --build build/cpp
          ctest --test-dir build/cpp --output-on-failure
      - name: Optional pybind11 event scheduler binding
        run: |
          sudo apt-get install -y python3-dev
          pip install pytest
          cmake -S . -B build/cpp-bindings -DBUILD_PYBIND11_BINDINGS=ON
          cmake --build build/cpp-bindings
          ctest --test-dir build/cpp-bindings --output-on-failure
          POLARIS_EVENT_SCHEDULER_BUILT=1 PYTHONPATH=build/cpp-bindings python -m pytest tests/unit/test_event_scheduler_binding.py -q
