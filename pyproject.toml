[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris"
version = "0.0.1"
description = "POLARIS P0 foundation — decision-support multi-hazard architecture"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "POLARIS team (Helmut, Laura, Lenin)" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "httpx>=0.27",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["platform/api", "generators", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "build", "dist", "simulation/cpp"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["platform/api", "generators/hazard", "harness/dev"]
