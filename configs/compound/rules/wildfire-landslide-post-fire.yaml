# ADR-0013 — post-fire slope + fire-weather screening (center footprint demo)
rule_id: wildfire-landslide-post-fire
hazard_ids: [wildfire, landslide]
phi_min:
  wildfire: 0.30
  landslide: 0.25
formula: union
formula_version: compound.chi.wildfire-landslide-post-fire.v0.2.0
model_version: compound.chi.v0.2.0
hazard_id: compound/wildfire-landslide
notes: >
